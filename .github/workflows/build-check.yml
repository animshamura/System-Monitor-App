name: Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SystemMonitorApp.slnx

      - name: Build solution
        run: dotnet build SystemMonitorApp.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test SystemMonitorApp.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
